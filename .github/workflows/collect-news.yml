name: Collect news
# Gathers every source on GitHub's network every 15 minutes. The snapshot lands on the `live-news` branch;
# with the NEWS_APP_ORIGIN and NEWS_ADMIN_TOKEN secrets set, each batch is also pushed into the app.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect.ts', 'server/ingest/**', '.github/workflows/collect-news.yml']

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        run: node --import tsx scripts/collect.ts "$RUNNER_TEMP/latest.json"
        env:
          APP_ORIGIN: ${{ secrets.NEWS_APP_ORIGIN }}
          ADMIN_TOKEN: ${{ secrets.NEWS_ADMIN_TOKEN }}
          DEMO_AUTH: '0'
      - name: Publish snapshot to the live-news branch
        run: |
          git config user.name "the-news-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan live-news-snapshot
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p live && cp "$RUNNER_TEMP/latest.json" live/latest.json
          git add live/latest.json
          git commit -q -m "Live news $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin HEAD:live-news
